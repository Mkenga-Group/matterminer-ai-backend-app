openapi: 3.0.0
info:
  title: MatterMiner API: Calendar Sync & Wallet Services
  version: 1.0.0
  description: >
    Welcome to the MatterMiner Core API. This service provides a multi-tenant infrastructure for conversational AI agents, allowing them to:

    1. **Calendar Sync:** Seamlessly authenticate, read, write, and synchronize events with external providers (like Google Calendar) using a unified Event schema.

    2. **AI Wallet Services:** Track and deplete AI credit usage on a strictly per-tenant basis.

    3. **Workflow Memory (Vault):** Maintain amnesia-proof context for in-progress chat sessions and event drafts.

    **Authentication:** All secured endpoints require a JWT bearer token passed in the `Authorization: Bearer <token>` header. The token must contain the `tenantId` payload to ensure strict data isolation.

servers:
  - url: https://dev.matterminer.com/calendar
    description: Development Server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Event:
      type: object
      required: [tenantId, title, startTime, endTime]
      properties:
        title: { type: string, example: "Q3 Planning Strategy" }
        tenantId: { type: string, example: "tenant_123" }  
        description: { type: string, example: "Quarterly review of marketing goals." } 
        startTime: { type: string, format: date-time, example: "2026-03-15T10:00:00Z" }
        endTime: { type: string, format: date-time, example: "2026-03-15T11:00:00Z" }
        location: 
          type: string
          nullable: true
          description: Physical address or meeting link (e.g. Zoom, Google Meet)
          example: "https://zoom.us/j/123456789"
        attendees:
          type: array
          nullable: true
          description: List of attendee email addresses or metadata objects
          items:
            type: object
            properties:
              email: { type: string, format: email, example: "client@example.com" }
              displayName: { type: string, example: "John Doe" }

    WatchRequest:
      type: object
      required: [id, type, address]
      properties:
        id:
          type: string
          format: uuid
          description: A unique string that identifies this new channel.
        type:
          type: string
          example: "web_hook"
        address:
          type: string
          format: uri
          description: The URL where you want Google to send notifications.
        token:
          type: string
          description: An arbitrary string delivered to the target address with each notification. Use this for security/validation.
        expiration:
          type: string
          format: int64
          description: Unix timestamp (ms) when this channel should expire.

    SyncMessage:
      type: object
      properties:
        tenant_id:
          type: string
          example: "tenant_123"
        action:
          type: string
          enum: [INCREMENTAL_SYNC, FULL_SYNC, DISCONNECT]
          example: "INCREMENTAL_SYNC"
        timestamp:
          type: string
          format: date-time
        priority:
          type: integer
          minimum: 1
          maximum: 10
          default: 5

    CalendarEventProcessed:
      type: object
      properties:
        eventId:
          type: string
        status:
          type: string
          example: "synced_to_db"
        routingKey:
          type: string
          example: "events.updated"
security:
  - bearerAuth: []

paths:
  /events:
    get:
      summary: Retrieve all events for each tenant
      tags: [Events]
      parameters:
        - in: query
          name: tenant_id
          schema:
            type: string
          required: true
          description: Unique ID for the tenant (defaults to 'default_tenant')    
        - name: page
          in: query
          description: The page number to retrieve.
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          description: Number of records per page.
          schema:
            type: integer
            default: 10
            maximum: 100    
      responses:
        200:
          description: A list of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        404:
          description: No event found
    post:
      summary: Create a new event
      tags: [Events]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        201:
          description: Created

  /events/{event_id}:
    get:
      summary: Get event by ID
      tags: [Events]
      parameters:
        - in: path
          name: event_id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Success
    delete:
      summary: Delete event
      tags: [Events]
      parameters:
        - in: path
          name: event_id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Deleted
  /events/event-range:
    get:
      summary: Retrieve paginated events by date range
      description: |
        Fecthes a list of events for the authenticated tenant. 
        - If `startTime` or `endTime` are omitted, it defaults to a **2-day window starting from now**.
        - `endTime` must be chronologically after `startTime`.
        - Supports fuzzy search across title and description.
      tags: [Events]
      parameters: 
        - name: startTime
          in: query
          description: ISO 8601 timestamp for the start of the range. Defaults to current time.
          required: false
          schema:
            type: string
            format: date-time
            example: "2026-02-20T09:00:00Z"
        - name: endTime
          in: query
          description: ISO 8601 timestamp for the end of the range. Defaults to startTime + 2 days.
          required: false
          schema:
            type: string
            format: date-time
            example: "2026-02-22T09:00:00Z"
        - name: page
          in: query
          description: The page number to retrieve.
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          description: Number of records per page.
          schema:
            type: integer
            default: 10
            maximum: 100          
        - name: search
          in: query
          description: Fuzzy search keyword for event title or description.
          schema:
            type: string
        - name: x-tenant-id
          in: header
          description: The unique identifier for the tenant (required if not provided via auth token).
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A paginated list of events.
          headers:
            X-Total-Count:
              description: Total number of records matching the filter criteria across all pages.
              schema:
                type: integer
            Access-Control-Expose-Headers:
              description: Informs the browser that X-Total-Count is safe to access via scripts.
              schema:
                type: string        
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
                  pagination:
                    type: object
                    properties:
                      totalItems:
                        type: integer
                      totalPages:
                        type: integer
                      currentPage:
                        type: integer
                      pageSize:
                        type: integer
                      rangeUsed:
                        type: object
                        properties:
                          start:
                            type: string
                            format: date-time
                          end:
                            type: string
                            format: date-time
                      query:
                        type: string
                        nullable: true
        '400':
          description: Bad Request. Occurs on invalid date formats or if endTime is before startTime.
        '401':
          description: Unauthorized. Missing or invalid Tenant ID.
        '404':
          description: A list of events

  /events/check-conflicts:          
    get:
      summary: Verifies time slot availability.
      description: Returns a boolean indicating whether a time slot conflict exists. Use this to validate availability before attempting to create a new event.
      tags: [Events]
      parameters:
        - in: query
          name: tenantId
          required: true
          schema:
            type: string
          description: Unique ID for the tenant
        - in: query
          name: startTime
          required: true
          schema:
            type: string
            format: date-time
          description: ISO 8601 timestamp for the start of the time slot
        - in: query
          name: endTime
          required: true
          schema:
            type: string
            format: date-time
          description: ISO 8601 timestamp for the end of the time slot
      responses:
        200:
          description: Success
  /events/sync-google:
    post:
      summary: Trigger Google Sync
      tags: [Sync]
      responses:
        200:
          description: Sync initiated

  /auth/google:
    get:
      summary: Initialize Google OAuth flow
      description: |
        Redirects the user to Google's consent screen. Requires a tenant_id query parameter to track the session.
        **Note:** Due to browser security (CORS), the "Try it out" button in Swagger UI will show a 'Failed to fetch' error.
        To test this, copy the Request URL and paste it directly into your browser address bar.
      tags: [Auth]
      parameters:
        - in: query
          name: tenant_id
          schema:
            type: string
          required: true
          description: Unique ID for the tenant (defaults to 'default_tenant')
      responses:
        302:
          description: Redirect to Google Authorization Server
          headers: 
             Location:
                description: The Google OAuth URL to which the user is redirected.
                schema:
                  type: string
                  example: "https://accounts.google.com/o/oauth2/v2/auth?..."
                       
        500:
          description: Internal Server Error

  /auth/oauth2callback:
    get:
      summary: Google OAuth callback handler
      description: This endpoint is called by Google after the user authorizes the app. It exchanges the auth code for tokens, stores them in Redis, and issues a JWT.
      tags: [Auth]
      parameters:
        - in: query
          name: code
          schema:
            type: string
          required: true
          description: The authorization code provided by Google
        - in: query
          name: state
          schema:
            type: string
          description: Usually contains the tenantId passed during the initial request
      responses:
        200:
          description: Successful authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  jwtToken: { type: string, description: "Bearer token for subsequent API calls" }
                  tenantId: { type: string }
        400:
          description: Missing authorization code
        500:
          description: Failed to exchange tokens or store session

  /auth/googleRefreshToken:
    post:
      summary: Silently renew Google Calendar access token
      description: |
        Uses the stored refresh token to get a new access token from Google. 
        Requires a valid JWT token in the Authorization header.
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_id:
                  type: string
                  description: Optional if provided in JWT
      responses:
        200:
          description: Token successfully refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  tenantId: { type: string }
        401:
          description: No valid refresh token found or JWT missing/invalid
        500:
          description: Server error during refresh flow

  /webhook/register:
    post:
      summary: Start watching a Google Calendar
      description: Tells Google to start sending notifications to our webhook URL whenever a calendar changes.
      tags: [Webhooks]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Watch successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchRequest'

  /webhook/google:
    post:
      summary: Google Calendar Notification Receiver
      description: |
        The public endpoint that Google pings. 
        Note: This endpoint is called by Google, not by the client. 
        It expects headers like `x-goog-channel-id` and `x-goog-resource-state`.
      tags: [Webhooks]
      responses:
        200:
          description: Acknowledged
        404:
          description: Channel ID not recognized

  /sync/trigger:
    post:
      summary: Manually trigger tenant sync
      description: Pushes a 'SyncMessage' to the RabbitMQ exchange to begin background processing.
      tags: [Sync]
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                forceFullSync:
                  type: boolean
                  default: false
      responses:
        202:
          description: Sync request accepted and queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId: { type: string, format: uuid }
                  status: { type: string, example: "queued" }

  /sync/status/{jobId}:
    get:
      summary: Check background sync status
      tags: [Sync]
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      responses:
        200:
          description: Current status of the sync job

paths:
  /wallet/check-balance:
    get:
      summary: Pre-flight balance check
      description: Verifies if a tenant has enough tokens (RESERVE_AMOUNT) to start an AI interaction.
      tags:
        - Wallet
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: tenantId
          required: true
          schema:
            type: string
          description: Unique ID of the tenant
      responses:
        200:
          description: Balance check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed:
                    type: boolean
                    example: true
                  balance:
                    type: integer
                    example: 8500
                  error:
                    type: string
                    nullable: true
        401:
          description: Unauthorized - Missing or invalid token

  /wallet/deplete:
    post:
      summary: Track and deduct token usage
      description: Called after AI interaction to deduct actual tokens used from the wallet.
      tags:
        - Wallet
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenantId
                - total_tokens
              properties:
                tenantId:
                  type: string
                  example: "12345678"
                total_tokens:
                  type: integer
                  example: 450
      responses:
        200:
          description: Tokens deducted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  newBalance:
                    type: integer
                    example: 8050
        400:
          description: Invalid input data
        500:
          description: Internal server error
